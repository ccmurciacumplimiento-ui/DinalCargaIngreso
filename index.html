  ARCHIVO ÚNICO, SIN INSTALACIÓN.
  Ábrelo con doble clic (o súbelo a cualquier hosting/intranet). Requiere
  internet la primera vez que se abre porque React, Tailwind y jsPDF se
  cargan desde CDN públicos (cdnjs / tailwindcss).

  SEGURIDAD — LEER ANTES DE USAR CON DATOS REALES:
  - La clave de administrador (ADMIN_PASSWORD, abajo en el script) queda
    visible para cualquiera que abra "Ver código fuente" de esta página.
    NO es una barrera de seguridad real, solo evita que un curioso entre
    por accidente. Para datos reales de conductores, esto necesita
    autenticación de verdad en un backend (Supabase/Firebase Auth).
  - Los registros se guardan en localStorage: quedan SOLO en el navegador
    donde se llenó el formulario o donde se abrió el panel admin — no se
    sincronizan entre celular/PC ni entre distintas personas. Para que el
    administrador vea, desde su equipo, lo que un conductor llenó en su
    celular, hace falta una base de datos real (ver sección "Cómo migrar"
    al final de este archivo, en el comentario final).
  - localStorage tiene un límite de ~5-10MB por navegador; muchas fotos en
    varios registros pueden agotarlo. La app avisa si esto pasa.
-->

/* ============================ STORAGE ============================
   Demo: localStorage. Para producción, reemplazar estas 4 funciones por
   llamadas a Supabase/Firebase — nada más en la app necesita cambiar.
=================================================================== */
const STORAGE_KEY = 'enrolamiento_registros_v1';

function listarRegistros() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { console.error(e); return []; }
}
function guardarRegistro(registro) {
  const registros = listarRegistros();
  registros.push(registro);
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(registros));
    return { ok: true };
  } catch (e) {
    return { ok: false, error: 'No se pudo guardar el registro localmente (posible límite de almacenamiento del navegador por el tamaño de las fotos). El PDF ya se descargó como respaldo; contacta al administrador.' };
  }
}
function actualizarEstadoRegistro(id, estado) {
  const registros = listarRegistros();
  const idx = registros.findIndex(r => r.id === id);
  if (idx === -1) return { ok: false };
  registros[idx].estado = estado;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(registros));
  return { ok: true };
}

/* ============================ VALIDADORES ============================ */
function estaVencida(fechaISO) {
  if (!fechaISO) return true;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  return new Date(fechaISO) < hoy;
}
function diasParaVencer(fechaISO) {
  if (!fechaISO) return null;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  return Math.ceil((new Date(fechaISO) - hoy) / 86400000);
}
function calcularEstadoDocumental(registro) {
  const fechas = [
    registro.conductor?.licencia?.fechaVencimiento,
    registro.vehiculo?.soat?.fechaVencimiento,
    registro.vehiculo?.tecnomecanica?.fechaVencimiento,
    registro.vehiculo?.polizaRCE?.fechaVencimiento,
  ];
  const alertaCumplimiento = registro.conductor?.sagrilaft?.esPEP === true || registro.conductor?.sagrilaft?.vinculadoListasRestrictivas === true;
  if (alertaCumplimiento) return 'vencido';
  if (fechas.some(estaVencida)) return 'vencido';
  if (fechas.some(f => { const d = diasParaVencer(f); return d !== null && d <= 30; })) return 'alerta';
  return 'ok';
}

/* ============================ ARCHIVOS ============================ */
function archivoADataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({ name: file.name, type: file.type, dataUrl: reader.result });
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const VERDE = [16, 150, 72];
const VERDE_OSCURO = [10, 85, 45];
const NARANJA = [237, 116, 16];
const GRIS = [100, 116, 139];
const VERDE_CLARO_BG = [235, 250, 240];

function badgeVencimiento(fechaISO) {
  if (!fechaISO) return 'Sin fecha';
  return fechaISO + (new Date(fechaISO) < new Date() ? '  [VENCIDO]' : '  [VIGENTE]');
}

function dibujarEncabezado(doc, pageWidth) {
  const mitad = pageWidth / 2;
  doc.setFillColor(...VERDE);
  doc.rect(0, 0, mitad, 3, 'F');
  doc.setFillColor(...NARANJA);
  doc.rect(mitad, 0, pageWidth - mitad, 3, 'F');

  const logoW = 34, logoH = 19;
  if (LOGO_EMPRESA_BASE64) {
    try { doc.addImage(LOGO_EMPRESA_BASE64, undefined, 8, 7, logoW, logoH); } catch (e) {}
  } else {
    doc.setDrawColor(...VERDE); doc.setLineWidth(0.4);
    doc.rect(8, 7, logoW, logoH);
    doc.setFontSize(7); doc.setTextColor(...VERDE);
    doc.text('LOGO EMPRESA', 8 + logoW / 2, 7 + logoH / 2 + 1, { align: 'center' });
  }

  const vw = 32, vh = 18;
  doc.setDrawColor(200, 205, 210); doc.setLineWidth(0.3);
  doc.rect(pageWidth - vw - 8, 7, vw, vh);
  doc.setFontSize(6.5); doc.setTextColor(...GRIS);
  doc.text('VIGILADO', pageWidth - vw / 2 - 8, 7 + vh / 2 - 1, { align: 'center' });
  doc.text('SUPERTRANSPORTE', pageWidth - vw / 2 - 8, 7 + vh / 2 + 4, { align: 'center' });

  doc.setFontSize(13); doc.setFont(undefined, 'bold'); doc.setTextColor(...VERDE_OSCURO);
  doc.text('Ficha de Enrolamiento y Formulario de Vinculación', pageWidth / 2, 15, { align: 'center' });
  doc.setFontSize(10); doc.setTextColor(...NARANJA);
  doc.text('Conductor / Vehículo — Circular 170', pageWidth / 2, 21, { align: 'center' });
  doc.setFont(undefined, 'normal');

  doc.setDrawColor(225, 228, 232); doc.setLineWidth(0.2);
  doc.line(8, 29, pageWidth - 8, 29);
  doc.setFontSize(6.5); doc.setTextColor(...GRIS);
  doc.text('Código: FR-ENR-01', 8, 33.5);
  doc.text('Versión: 1.0', pageWidth / 2, 33.5, { align: 'center' });
  doc.text('Generado: ' + new Date().toLocaleString('es-CO'), pageWidth - 8, 33.5, { align: 'right' });
}

function dibujarPiePagina(doc, pageWidth, pageHeight) {
  const totalPaginas = doc.internal.getNumberOfPages();
  for (let i = 1; i <= totalPaginas; i++) {
    doc.setPage(i);
    doc.setDrawColor(225, 228, 232); doc.setLineWidth(0.2);
    doc.line(8, pageHeight - 10, pageWidth - 8, pageHeight - 10);
    doc.setFontSize(6.5); doc.setTextColor(...GRIS); doc.setFont(undefined, 'normal');
    doc.text('DINALCARGA S.A.S. — Distribuidora Nacional de Carga', 8, pageHeight - 6);
    doc.text('Página ' + i + ' de ' + totalPaginas, pageWidth - 8, pageHeight - 6, { align: 'right' });
  }
}

function dibujarSeccion(doc, titulo, filas, x, y, ancho, color = VERDE) {
  doc.setFillColor(...color);
  doc.rect(x, y, ancho, 6, 'F');
  doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont(undefined, 'bold');
  doc.text(titulo, x + 2, y + 4.2);
  doc.setFont(undefined, 'normal');
  let cursorY = y + 6;
  doc.setFontSize(8.5);
  filas.forEach(([etiqueta, valor], idx) => {
    const alt = idx % 2 === 0;
    if (alt) { doc.setFillColor(...VERDE_CLARO_BG); } else { doc.setFillColor(255,255,255); }
    doc.rect(x, cursorY, ancho, 5.5, 'F');
    doc.setTextColor(...GRIS);
    doc.text(String(etiqueta), x + 2, cursorY + 3.8);
    doc.setTextColor(30,30,30);
    doc.text(String(valor || '—'), x + ancho * 0.48, cursorY + 3.8);
    cursorY += 5.5;
  });
  doc.setDrawColor(...color); doc.setLineWidth(0.3);
  doc.rect(x, y, ancho, cursorY - y);
  return cursorY + 4;
}

function generarPdfEnrolamiento(registro) {
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const margenX = 10;
  const anchoColumna = (pageWidth - margenX * 2 - 4) / 2;

  dibujarEncabezado(doc, pageWidth);
  let y = 40;
  const yInicioFila = y;

  y = dibujarSeccion(doc, 'DATOS DEL CONDUCTOR', [
    ['Nombre completo', registro.conductor.nombreCompleto],
    ['Documento', registro.conductor.tipoDocumento + ' ' + registro.conductor.numeroDocumento],
    ['Fecha expedición', registro.conductor.fechaExpedicionDocumento],
    ['Teléfono', registro.conductor.telefono],
    ['Dirección', registro.conductor.direccion],
    ['Ciudad', registro.conductor.ciudad],
    ['Licencia N°', registro.conductor.licencia.numero],
    ['Categoría', registro.conductor.licencia.categoria],
    ['Vence licencia', badgeVencimiento(registro.conductor.licencia.fechaVencimiento)],
  ], margenX, yInicioFila, anchoColumna, VERDE);

  const y2 = dibujarSeccion(doc, 'PROPIETARIO / TENEDOR', [
    ['¿Mismo conductor?', registro.mismoPropietario ? 'Sí' : 'No'],
    ['Nombre / Razón social', registro.propietario.nombreRazonSocial],
    ['Documento', registro.propietario.documento],
    ['Teléfono', registro.propietario.telefono],
    ['Dirección', registro.propietario.direccion],
    ['Aplica tenedor', registro.aplicaTenedor ? 'Sí' : 'No'],
    ['Tenedor', registro.aplicaTenedor ? registro.tenedor.nombre : '—'],
  ], margenX + anchoColumna + 4, yInicioFila, anchoColumna, VERDE);

  y = Math.max(y, y2) + 2;
  const yInicioFila2 = y;

  y = dibujarSeccion(doc, 'VEHÍCULO', [
    ['Placa', registro.vehiculo.placa],
    ['Marca / Modelo', registro.vehiculo.marca + ' ' + registro.vehiculo.modelo],
    ['Color', registro.vehiculo.color],
    ['Tipo carrocería', registro.vehiculo.tipoCarroceria],
    ['N° Motor', registro.vehiculo.numeroMotor],

/* ============================ SIGNATURE PAD ============================ */
function SignaturePad({ value, onChange }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const [vacio, setVacio] = useState(!value);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const ratio = window.devicePixelRatio || 1;
    canvas.width = canvas.offsetWidth * ratio;
    canvas.height = canvas.offsetHeight * ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#0F172A';
  }, []);

  function posicion(e) {
    const rect = canvasRef.current.getBoundingClientRect();
    const punto = e.touches ? e.touches[0] : e;
    return { x: punto.clientX - rect.left, y: punto.clientY - rect.top };
  }
  function iniciar(e) {
    e.preventDefault(); drawing.current = true;
    const ctx = canvasRef.current.getContext('2d');
    const { x, y } = posicion(e);
    ctx.beginPath(); ctx.moveTo(x, y);
  }
  function mover(e) {
    if (!drawing.current) return;
    e.preventDefault();
    const ctx = canvasRef.current.getContext('2d');
    const { x, y } = posicion(e);
    ctx.lineTo(x, y); ctx.stroke();
    setVacio(false);
  }
  function terminar() {
    if (!drawing.current) return;
    drawing.current = false;
    onChange(canvasRef.current.toDataURL('image/png'));
  }
  function limpiar() {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    setVacio(true); onChange('');
  }

  return (
    <div>
      <div className="relative rounded-lg border-2 border-dashed border-slate-300 bg-white">
        <canvas ref={canvasRef} className="h-40 w-full touch-none rounded-lg"
          onMouseDown={iniciar} onMouseMove={mover} onMouseUp={terminar} onMouseLeave={terminar}
          onTouchStart={iniciar} onTouchMove={mover} onTouchEnd={terminar} />
        {vacio && <span className="pointer-events-none absolute inset-0 flex items-center justify-center text-sm text-slate-400">Firme aquí con el dedo o el mouse</span>}
      </div>
      <button type="button" onClick={limpiar} className="mt-2 inline-flex items-center gap-1.5 text-xs font-medium text-slate-500 hover:text-corporate-800">
        <IconEraser size={14} /> Borrar firma
      </button>
    </div>
  );
}

/* ============================ PORTAL CONDUCTOR ============================ */
function validarPaso(paso, datos) {
  if (paso === 0) {
    const c = datos.conductor;
    if (!c.nombreCompleto || !c.numeroDocumento || !c.licencia.numero) return 'Complete nombre, documento y número de licencia antes de continuar.';
  }
  if (paso === 1) {
    if (!datos.propietario.nombreRazonSocial || !datos.propietario.documento) return 'Complete los datos del propietario antes de continuar.';
  }
  if (paso === 2) {
    if (!datos.vehiculo.placa || !datos.vehiculo.marca) return 'Complete al menos placa y marca del vehículo antes de continuar.';
  }
  if (paso === 3) {
    if (!datos.declaracion.aceptaAcuerdoSeguridad) return 'Debe aceptar el Acuerdo de Confidencialidad y Seguridad.';
    if (!datos.declaracion.conflictoInteres.declaracionVeraz) return 'Debe declarar como veraz la información del Formato de Conflicto de Interés.';
    if (!datos.declaracion.aceptaHabeasData) return 'Debe autorizar el tratamiento de datos personales (Habeas Data).';
    if (!datos.declaracion.aceptaVeracidad) return 'Debe aceptar la declaración general de veracidad.';
    if (!datos.declaracion.firmaDataUrl) return 'Debe firmar digitalmente para completar el registro.';
  }
  return null;
}

function PortalConductor({ onSalir }) {
  const [paso, setPaso] = useState(0);
  const [datos, setDatos] = useState(crearRegistroVacio());
  const [error, setError] = useState('');
  const [enviado, setEnviado] = useState(false);

  const actualizar = (cambios) => setDatos(prev => ({ ...prev, ...cambios }));

  function siguiente() {
    const msg = validarPaso(paso, datos);
    if (msg) { setError(msg); return; }
    setError('');
    if (paso < 3) { setPaso(p => p + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    finalizar();
  }
  function anterior() {
    setError(''); setPaso(p => Math.max(0, p - 1)); window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function finalizar() {
    const registroFinal = { ...datos, declaracion: { ...datos.declaracion, fechaHoraFirma: new Date().toISOString() } };
    const resultado = guardarRegistro(registroFinal);
    if (!resultado.ok) { setError(resultado.error); return; }
    generarPdfEnrolamiento(registroFinal);
    setEnviado(true);
  }

  if (enviado) {
    return (
      <div className="flex min-h-screen items-center justify-center bg-neutral-50 px-4">
        <div className="max-w-sm rounded-xl bg-white p-8 text-center shadow-sm ring-1 ring-slate-200">
          <IconCheck size={48} className="mx-auto mb-4 text-green-600" />
          <h1 className="text-lg font-semibold text-slate-800">Registro completado</h1>
          <p className="mt-2 text-sm text-slate-500">Su ficha de enrolamiento fue registrada y el PDF se descargó automáticamente.</p>
          <div className="mt-5 space-y-2">
            <button onClick={() => { setDatos(crearRegistroVacio()); setPaso(0); setEnviado(false); }} className="w-full rounded-lg bg-corporate-800 py-2 text-sm font-medium text-white hover:bg-corporate-950 transition">Registrar otro conductor</button>
            {onSalir && <button onClick={onSalir} className="w-full text-center text-xs text-slate-500 hover:text-slate-700">← Volver al inicio</button>}
          </div>
        </div>
      </div>
    );
  }

  const pasos = [
    <Step1Conductor key="1" datos={datos} actualizar={actualizar} />,
    <Step2Propietario key="2" datos={datos} actualizar={actualizar} />,
    <Step3Vehiculo key="3" datos={datos} actualizar={actualizar} />,
    <Step4Declaracion key="4" datos={datos} actualizar={actualizar} />,
  ];

  return (
    <WizardLayout pasoActual={paso} onAnterior={anterior} onSiguiente={siguiente} textoBotonFinal="Enviar y generar PDF">
      {error && <div className="mb-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{error}</div>}
      {pasos[paso]}
    </WizardLayout>
  );
}

/* ============================ ADMIN — EXPORTAR CSV ============================ */
function exportarCSV(registros) {
  const encabezados = ['Fecha','Nombre','Documento','Teléfono','Placa','Marca','Modelo','Estado'];
  const filas = registros.map(r => [
    r.createdAt ? new Date(r.createdAt).toLocaleDateString('es-CO') : '',
    r.conductor?.nombreCompleto || '',
    r.conductor?.numeroDocumento || '',
    r.conductor?.celular || '',
    r.vehiculo?.placa || '',
    r.vehiculo?.marca || '',
    r.vehiculo?.modelo || '',
    r.estadoDocumental || r.estado || 'pendiente',
  ]);
  const csv = [encabezados, ...filas].map(f => f.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'registros_dinalcarga_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click(); URL.revokeObjectURL(url);
}

function AdminDashboard({ onSalir }) {

  const registrosConEstado = useMemo(() => registros.map(r => ({ ...r, estadoDocumental: calcularEstadoDocumental(r) })), [registros]);
  const registrosFiltrados = useMemo(() => registrosConEstado.filter(r => {
    const texto = filtros.texto.trim().toLowerCase();
    const coincideTexto = !texto || (r.vehiculo.placa || '').toLowerCase().includes(texto) || (r.conductor.numeroDocumento || '').toLowerCase().includes(texto) || (r.conductor.nombreCompleto || '').toLowerCase().includes(texto);
    const coincideEstado = filtros.estado === 'todos' || r.estadoDocumental === filtros.estado;
    const coincideFecha = !filtros.fecha || r.createdAt.slice(0, 10) === filtros.fecha;

            </button>
            <button onClick={cerrarSesion} className="flex items-center gap-1.5 text-sm text-slate-300 hover:text-white"><IconLogOut size={16} /> Cerrar sesión</button>
          </div>
        </div>

      <main className="mx-auto max-w-6xl space-y-6 px-6 py-6">
        {/* Tarjetas principales */}
        <div className="grid grid-cols-2 gap-4 sm:grid-cols-4">
          <StatCard icono={IconUsers} etiqueta="Total registros" valor={totales.total} tono="bg-slate-100 text-slate-700" />
          <StatCard icono={IconTruck} etiqueta="Vigentes" valor={totales.vigentes} tono="bg-green-100 text-green-700" />

          <div className="rounded-xl bg-white p-4 shadow-sm ring-1 ring-slate-200 text-center">
            <p className="text-2xl font-bold text-blue-700">{statsExtra.hoy}</p>

/* ============================ APP (ruteo simple por hash, sin librerías) ============================ */
function App() {
  const [ruta, setRuta] = useState(window.location.hash || '#/');
  useEffect(() => {
    const onHash = () => setRuta(window.location.hash || '#/');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  const [, forceUpdate] = useState(0);

  function irA(hash) { window.location.hash = hash; forceUpdate(n => n + 1); }

  /* Admin */
  if (ruta === '#admin') {
    if (!haySesionAdminActiva()) {
      return <AdminLogin onIngreso={() => forceUpdate(n => n + 1)} />;
    }
    return <AdminDashboard onSalir={() => { cerrarSesionAdmin(); irA('#/'); }} />;
  }
  /* Transportador — acceso directo sin clave */
  if (ruta === '#transportador') {
    return <PortalConductor onSalir={() => irA('#/')} />;
  }
  /* Landing */
  return <LandingPage onSeleccion={(rol) => irA('#' + rol)} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
